name: docs_pages_workflow
 
# execute this workflow automatically when a we push to master
on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write
 
jobs:
 
  build_docs_job:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
 
    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.4

      - name: Set up Python
        uses: actions/setup-python@v2.2.1
        with:
          python-version: 3.11
 
      - name: Install GSL (required to build teobresums/pyseobnr)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgsl-dev

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-docs.txt -r requirements-catalogs.txt -r requirements-models.txt
          python -m pip install .

      - name: Apply pycbc numpy 2.x compatibility patch
        run: |
          python scripts/patch_pycbc_numpy2.py

      - name: make the sphinx docs
        run: |
          make -C docs clean 
          # sphinx-apidoc -f -o docs/source . -H Test -e -t docs/source/_templates
          make -C docs html
          cd docs/build/html/
          touch .nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
          force_orphan: true
